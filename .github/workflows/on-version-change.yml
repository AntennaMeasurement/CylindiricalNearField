name: Tag version changes

on:
  push:

permissions:
  contents: write
  id-token: write

jobs:
  tag-version:
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compare project versions
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          import subprocess
          import tomllib

          before = os.environ["BEFORE_SHA"]
          current = os.environ["CURRENT_SHA"]
          if set(before) == {"0"}:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("changed=false\n")
              raise SystemExit(0)

          def get_version(revision):
              content = subprocess.check_output(
                  ["git", "show", f"{revision}:pyproject.toml"], text=True
              )
              return tomllib.loads(content)["project"]["version"]

          previous_version = get_version(before)
          current_version = get_version(current)
          changed = previous_version != current_version
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"changed={str(changed).lower()}\n")
              if changed:
                  output.write(f"version={current_version}\n")
          PY

      - name: Build package distributions
        if: steps.version.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish package to PyPI
        if: steps.version.outputs.changed == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

      - name: Create and push version tag
        if: steps.version.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "Hüseyin YİĞİT"
          git config user.email "yigit.hsyn@gmail.com"
          git tag -a "v${VERSION}" "${GITHUB_SHA}" -m "Release version ${VERSION}"
          git push origin "v${VERSION}"

      - name: Collect commit messages since previous tag
        if: steps.version.outputs.changed == 'true'
        run: |
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            git log --format='- %s' "${previous_tag}..${GITHUB_SHA}" > release-notes.md
          else
            git log --format='- %s' "${GITHUB_SHA}" > release-notes.md
          fi
          cat release-notes.md

      - name: Create GitHub Release
        if: steps.version.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v${VERSION}" dist/* \
            --title "Release v${VERSION}" \
            --notes-file release-notes.md
